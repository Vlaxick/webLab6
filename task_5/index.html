<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Weather Widget</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<main class="weather-container">
  <div class="weather-widget">

    <div class="forecast">
      <div class="forecast-day">
        <span>Mon</span>
        <strong>17°</strong>
      </div>
      <div class="forecast-day">
        <span>Tue</span>
        <strong>19°</strong>
      </div>
      <div class="forecast-day">
        <span>Wed</span>
        <strong>16°</strong>
      </div>
      <div class="forecast-day">
        <span>Thu</span>
        <strong>18°</strong>
      </div>
      <div class="forecast-day">
        <span>Fri</span>
        <strong>21°</strong>
      </div>
    </div>

    <div class="weather-card">
      <div class="weather-info">
        <span class="weather-label">TODAY'S WEATHER</span>
        <span class="temperature">17<span>°</span></span>
        <span class="weather-description">Cloudy</span>
      </div>
    </div>

    <div class="cloud">
      <div class="cloud-part cloud-left"></div>
      <div class="cloud-part cloud-center"></div>
      <div class="cloud-part cloud-right"></div>
      <div class="cloud-base"></div>
    </div>

    <div class="weather-controls">
      <button type="button" class="arrow" aria-label="Попередній день">
        <span class="material-icons">arrow_back</span>
      </button>
      <button type="button" class="arrow" aria-label="Наступний день">
        <span class="material-icons">arrow_forward</span>
      </button>
    </div>

  </div>
</main>

</body>
</html>
