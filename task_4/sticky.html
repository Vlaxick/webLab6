<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="sticky-demo">

<h1>Приклад липкої навігації</h1>
<p>Прокрути сторінку вниз, щоб побачити ефект.</p>

<nav>
  <a href="#home">Головна</a> |
  <a href="#courses">Курси</a> |
  <a href="#contacts">Контакти</a>
</nav>

<section id="home">
  <h2>Головна</h2>
  <p>Це перший розділ сторінки.</p>
</section>

<section id="courses">
  <h2>Курси</h2>
  <p>Це другий розділ сторінки.</p>
</section>

<section id="contacts">
  <h2>Контакти</h2>
  <p>Це третій розділ сторінки.</p>
</section>

</body>
</html>
